{% extends 'base.html' %}

{% block content %}
<main class="flex-1 w-full pt-16 pb-24 bg-surface">
  <div class="mx-auto max-w-3xl px-margin">
    <section class="rounded-[30px] bg-gradient-to-br from-primary-fixed/60 via-surface-container-lowest to-secondary-fixed/50 p-space-lg shadow-[0_16px_40px_rgba(158,65,46,0.12)] border border-outline/10">
      <div class="flex items-center justify-between gap-3">
        <div>
          <p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-[0.12em]">Clientes</p>
          <h1 class="mt-1 font-headline-lg text-headline-lg text-on-surface">Registrar nuevo cliente</h1>
        </div>
        <div class="flex h-12 w-12 items-center justify-center rounded-full bg-primary-container text-primary shadow-sm">
          <span class="material-symbols-outlined text-[22px]">person_add</span>
        </div>
      </div>
    </section>

    <section class="mt-space-md rounded-[30px] bg-surface-container-lowest p-space-lg shadow-[0_16px_40px_rgba(158,65,46,0.08)] border border-outline/10">
      <form method="post" class="space-y-space-md">
        {% csrf_token %}

        <div>
          <label for="nombre" class="mb-2 block font-label-md text-label-md text-on-surface-variant">Nombre</label>
          <input id="nombre" name="nombre" type="text" required class="w-full rounded-2xl border border-outline/40 bg-surface-container-low px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/70 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary-container/40" placeholder="Ej. Ana García" />
        </div>

        <div>
          <label for="email" class="mb-2 block font-label-md text-label-md text-on-surface-variant">Email</label>
          <input id="email" name="email" type="email" required class="w-full rounded-2xl border border-outline/40 bg-surface-container-low px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/70 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary-container/40" placeholder="correo@ejemplo.com" />
        </div>

        <div>
          <label for="telefono" class="mb-2 block font-label-md text-label-md text-on-surface-variant">Teléfono</label>
          <input id="telefono" name="telefono" type="tel" class="w-full rounded-2xl border border-outline/40 bg-surface-container-low px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/70 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary-container/40" placeholder="(555) 123-4567" />
        </div>

        <div class="flex items-center justify-between gap-3 pt-space-xs">
          <a href="{% url 'cliente_listar' %}" class="inline-flex items-center justify-center rounded-full bg-surface-container px-4 py-3 font-label-md text-label-md text-on-surface-variant transition hover:bg-surface-container-high">
            Cancelar
          </a>
          <button type="submit" class="inline-flex items-center justify-center gap-2 rounded-full bg-primary-container px-5 py-3 font-label-md text-label-md text-on-primary shadow-sm transition hover:opacity-95">
            <span class="material-symbols-outlined text-[18px]">save</span>
            <span>Guardar cliente</span>
          </button>
        </div>
      </form>
    </section>
  </div>
</main>
{% endblock %}
